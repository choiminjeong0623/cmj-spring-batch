// cmj-spring-batch — 독립 프로젝트 (✅ 실제로도 auth·common-security·security·gateway·portal·batch가 별개 프로젝트였음)
// 참고용 예시 코드 — 실제 프로젝트 코드가 아님
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.cmj'
version = '1.0.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

repositories {
    mavenLocal()    // cmj-common-security 를 ./gradlew publishToMavenLocal 로 올려 둔 곳 (⚠️ 실제 배포 저장소는 미확인)
    mavenCentral()
}

dependencyManagement {
    imports { mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.3" }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'          // 우리 쪽 DB (Oracle)
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'        // 인사 DB (MS SQL Server, 읽기 전용)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
