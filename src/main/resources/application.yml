spring:
  batch:
    job:
      enabled: false          # 기동 시 자동 실행 끔 — 스케줄러로만 실행
    jdbc:
      initialize-schema: never

app:
  datasource:
    oracle:
      url: jdbc:oracle:thin:@//oracle:1521/CMJ
      username: ${DB_USER}
      password: ${DB_PASSWORD}
    hr:
      url: jdbc:sqlserver://hr-db.cmj-choiminjeong.internal:1433;databaseName=HR;encrypt=true
      username: ${HR_DB_USER}
      password: ${HR_DB_PASSWORD}

cmj:
  batch:
    zone: Asia/Seoul          # 배치 기준 시간대 (예시 값 — 실제 현지 시간대로 바꿔 씀)
  noti:
    batch-size: 100           # 알림 발송 배치가 한 번에 보내는 최대 건수 (⚠️ 예시 값)
    interval-ms: 60000        # 알림 발송 배치 주기 1분 (⚠️ 예시 값)
